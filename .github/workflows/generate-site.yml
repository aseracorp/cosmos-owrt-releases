name: Generate site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', 'README.md', 'robots.txt']
  repository_dispatch:
    types: [mirror-sync]
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: write

concurrency:
  group: generate-site
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate site
        run: |
          python3 scripts/generate.py \
            --source aseracorp/cosmos-owrt-releases \
            --root . \
            --token "${{ github.token }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: regenerate release index [skip ci]"
          git push origin main

      - name: Trigger Pages build (if needed)
        run: gh api -X POST repos/aseracorp/cosmos-owrt-releases/pages/builds --silent
        env:
          GH_TOKEN: ${{ github.token }}