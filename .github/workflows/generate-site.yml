name: Generate site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', 'README.md', 'robots.txt']
  repository_dispatch:
    types: [mirror-sync]
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: generate-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate site
        run: |
          python3 scripts/generate.py \
            --source aseracorp/cosmos-owrt-releases \
            --root site \
            --token "${{ github.token }}"
          cp robots.txt site/robots.txt

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4